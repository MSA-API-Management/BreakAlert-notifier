<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<body>

<div th:fragment="snackbar">
    <div id="snackbar" class="fixed top-6 left-1/2 -translate-x-1/2 z-[9999] min-w-[300px] max-w-md px-4 py-3 rounded-lg shadow-xl flex items-center justify-between gap-4 transition-all duration-300 ease-out opacity-0 -translate-y-12 pointer-events-none">
        <span id="snackbarText" class="text-sm font-medium text-white"></span>
        <button onclick="closeSnackbar()" class="text-white/80 hover:text-white transition-colors shrink-0 outline-none cursor-pointer">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
        </button>
    </div>

    <script th:inline="javascript">
        let snackbarTimeout;

        window.showSnackbar = function(text, type = 'success') {
            const snackbar = document.getElementById("snackbar");
            const snackbarText = document.getElementById("snackbarText");

            snackbarText.innerHTML = text;

            if (type === 'error') {
                snackbar.classList.add('bg-red-400');
                snackbar.classList.remove('bg-green-400', 'bg-blue-400');
            } else if (type === 'info') {
                snackbar.classList.add('bg-blue-400');
                snackbar.classList.remove('bg-green-400', 'bg-red-400');
            } else {
                snackbar.classList.add('bg-green-400');
                snackbar.classList.remove('bg-red-400', 'bg-blue-400');
            }

            snackbar.classList.remove('opacity-0', '-translate-y-12', 'pointer-events-none');
            snackbar.classList.add('opacity-100', 'translate-y-0', 'pointer-events-auto');

            clearTimeout(snackbarTimeout);
            snackbarTimeout = setTimeout(() => {
                window.closeSnackbar();
            }, 4000);
        };

        window.closeSnackbar = function() {
            const snackbar = document.getElementById("snackbar");
            snackbar.classList.remove('opacity-100', 'translate-y-0', 'pointer-events-auto');
            snackbar.classList.add('opacity-0', '-translate-y-12', 'pointer-events-none');
        };

        /*<![CDATA[*/
        document.addEventListener('DOMContentLoaded', () => {
            const successMsg = /*[[${successMessage}]]*/ null;
            const errorMsg = /*[[${errorMessage}]]*/ null;
            const infoMsg = /*[[${infoMessage}]]*/ null;

            if (successMsg) window.showSnackbar(successMsg, 'success');
            if (errorMsg) window.showSnackbar(errorMsg, 'error');
            if (infoMsg) window.showSnackbar(infoMsg, 'info');
        });
        /*]]>*/
    </script>
</div>

</body>
</html>
