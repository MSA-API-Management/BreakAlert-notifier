<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Something went wrong</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="m-0 p-0 font-sans bg-white h-screen flex flex-col items-center justify-center">

<h1 class="block text-black text-3xl font-bold mb-2">Something went wrong...</h1>
<h4 class="block text-black text-lg font-medium mb-4" th:if="${credentials}">You entered bad credentials</h4>

<h3 class="block text-black">
    <a href="/" class="btn-primary">Go to start</a>
</h3>

</body>
</html>
