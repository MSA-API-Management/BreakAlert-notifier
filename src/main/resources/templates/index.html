<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="ISO-8859-1">
	<title>Welcome to the Notifier</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
        }
        h1 {
            color: #333;
        }
        a {
            display: inline-block;
            margin-top: 10px;
            text-decoration: none;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #3498db;
            color: #fff;
        }
        a:hover {
            background-color: #2980b9;
        }
        p {
            margin-top: 10px;
        }
        .text-center {
            text-align: center;
        }
    </style>

</head>
<body>
	<div class="container text-center">
		<h1>Welcome to to the Notifier Application</h1>
		<h3><a th:href="@{/register}" class="btn btn-primary">Register</a></h3>
		<h3><a th:href="@{/loginPage}" class="btn btn-primary">Login</a></h3>
        <p th:if="${successMessage}" th:text="${successMessage}" style="color: green;"></p>
        <p th:if="${errorMessage}" th:text="${errorMessage}" style="color: red;"></p>
	</div>
</body>
</html>
