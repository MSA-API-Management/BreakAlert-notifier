<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="ISO-8859-1">
	<title>Welcome to the Notifier</title>
    <link rel="stylesheet" th:href="@{/css/index.css}" />
</head>
<body>
	<div class="container text-center">
		<h1>Welcome to to the Notifier Application</h1>
		<h3><a th:href="@{/register}" class="btn btn-primary">Register</a></h3>
		<h3><a th:href="@{/loginPage}" class="btn btn-primary">Login</a></h3>
        <p th:if="${successMessage}" th:text="${successMessage}" id="success"></p>
        <p th:if="${errorMessage}" th:text="${errorMessage}" id="error"></p>
	</div>
</body>
</html>
