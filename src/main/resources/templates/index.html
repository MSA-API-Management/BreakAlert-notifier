<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Welcome to the Notifier</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="tw-body">

<div class="tw-card !pb-2 text-center flex flex-col items-center">
    <h1 class="tw-heading">Welcome to BreakAlert</h1>

    <div class="flex flex-col sm:flex-row gap-4 w-full justify-center">
        <a th:href="@{/loginPage}" class="btn-primary w-full sm:w-32 text-center">Login</a>
        <a th:href="@{/register}" class="btn-primary w-full sm:w-32 text-center">Register</a>
    </div>

    <div class="mt-6">
        <p th:if="${successMessage}" th:text="${successMessage}" class="text-green-600 font-medium m-0"></p>
        <p th:if="${errorMessage}" th:text="${errorMessage}" class="text-red-600 font-medium m-0"></p>
    </div>

    <div class="w-full text-right italic text-gray-400 mt-2">
        v2.0.0 (28.10.2026)
    </div>
</div>

</body>
</html>
