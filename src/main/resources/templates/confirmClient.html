<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GitLab Client</title>
    <link rel="stylesheet" th:href="@{/css/confirmClient.css}" />
</head>
<body>
<div th:if="${urlCorrect}">
    <form th:action="@{/dashboard}" method="get">
        <h1>GitLab Client successfully added!</h1>
        <h4>You can still change the URL if you want to.</h4>
        <div>
            <input type="hidden" name="token">
            <input type="submit" value="Go Back To Dashboard">
        </div>
    </form>
</div>
<div th:if="${urlWrong}" name="outerDiv">
    <form th:action="@{/dashboard}" method="get">
        <h1>Something went wrong when adding your GitLab Client</h1>
        <h4>Your entered URL might not be correct. Try again later or enter a different URL.</h4>
        <div>
        <input type="hidden" name="token">
        <input type="submit" value="Go Back To Dashboard">
        </div>
    </form>
</div>

<script type="text/javascript" th:src="@{/js/clientConfirmation.js}"></script>

</body>
</html>
