<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Sign Up - CodeJava</title>

</head>
<body>
<div class="container text-center">
    <div>
        <h1>Sign Up</h1>
    </div>
    <form th:action="@{/process_register}" th:object="${user}" method="post">
            <div>
                <label for="name">Name: </label>
                <input type="text" id="name" th:field="*{name}" class="form-control" required minlength="2" maxlength="20"/>
            </div>
            <div>
                <label for="password">Password: </label>
                <input type="password" id="password" th:field="*{password}" required minlength="6" maxlength="15"/>
            </div>
            <div>
                <label for="email1">Email: </label>
                <input type="email" id="email1" th:field="*{email}" class="form-control" required minlength="5"/>
            </div>
            <button type="submit">Sign Up</button>
    </form>
</div>
</body>
</html>
