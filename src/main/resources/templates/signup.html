<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Sign Up</title>
    <link rel="stylesheet" th:href="@{/css/output.css}"/>
</head>
<body class="tw-body">

<div class="tw-card">
    <h1 class="tw-heading">Sign Up</h1>
    <form th:action="@{/process_register}" th:object="${user}" method="post" class="flex flex-col">
        <div class="w-full mb-4">
            <label for="name" class="block mb-1 text-gray-700 font-medium text-sm text-left">Name:</label>
            <input type="text" id="name" th:field="*{name}" required minlength="2" maxlength="20" class="tw-input">
        </div>
        <div class="w-full mb-6">
            <label for="email1" class="block mb-1 text-gray-700 font-medium text-sm text-left">Email:</label>
            <input type="email" id="email1" th:field="*{email}" required minlength="5" class="tw-input">
        </div>
        <div class="w-full mb-4">
            <label for="password" class="block mb-1 text-gray-700 font-medium text-sm text-left">Password:</label>
            <input type="password" id="password" th:field="*{password}" required minlength="6" maxlength="15"
                   class="tw-input">
        </div>
        <button type="submit" class="btn-primary w-full text-center mt-2">Sign Up</button>
    </form>
</div>

</body>
</html>
