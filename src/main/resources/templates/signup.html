<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="ISO-8859-1">
    <title>Sign Up</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
        }
        .container {
            background-color: #fff;
            border-radius: 8px;
            padding: 40px;
            padding-right: 60px;
            padding-left: 60px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            text-align: center;
        }
        h1 {
            color: #333;
        }
        form {
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            margin-bottom: 5px;
            align-self: flex-start;
            width: 100%;
            box-sizing: border-box;
        }
        input {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
            width: 100%;
            box-sizing: border-box;
        }
        button {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            background-color: #3498db;
            color: #fff;
            width: 100%;
            box-sizing: border-box;
        }
        button:hover {
            background-color: #2980b9;
        }
        #email1{
            margin-bottom: 30px;
        }
    </style>
</head>
<body>
<div class="container text-center">
    <div>
        <h1>Sign Up</h1>
    </div>
    <form th:action="@{/process_register}" th:object="${user}" method="post">
            <div></div>
                <label for="name">Name: </label>
                <input type="text" id="name" th:field="*{name}" required minlength="2" maxlength="20"/>

            <div></div>
                <label for="password">Password: </label>
                <input type="password" id="password" th:field="*{password}" required minlength="6" maxlength="15"/>

            <div></div>
                <label for="email1">Email: </label>
                <input type="email" id="email1" th:field="*{email}" required minlength="5"/>

            <button type="submit">Sign Up</button>
    </form>
</div>
</body>
</html>
